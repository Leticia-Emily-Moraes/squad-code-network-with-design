<meta name="description" content="Squad Code - rede interativa de agentes de desenvolvimento. Agentes executados com Claude Code (claude -p) via bridge local.">
<title>SQUAD CODE / Agent Network</title>
<!--STYLE-->
</head>
<body>
<main id="workspace" aria-label="Central de agentes de desenvolvimento">
  <div id="mapViewport" aria-label="Mapa do squad. Arraste para navegar e use a roda para ampliar.">
    <canvas id="cityCanvas" aria-hidden="true"></canvas>
    <div id="mapNodes"></div>
  </div>
  <div class="map-vignette" aria-hidden="true"></div>
  <div class="map-grain" aria-hidden="true"></div>
  <div class="corner-check top-left" aria-hidden="true"></div>
  <div class="corner-check bottom-right" aria-hidden="true"></div>
  <section id="homeView" class="home-view" aria-label="Painel geral" hidden></section>
  <section id="projectsView" class="home-view projects-view" aria-label="Projetos e operações" hidden></section>
  <section id="squadsView" class="home-view squads-view" aria-label="Squad Studio" hidden></section>

  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Voltar ao mapa do squad">
      <svg viewBox="0 0 34 40" aria-hidden="true"><path d="M17 2 32 11v18l-15 9L2 29V11Z"/><path d="m9 15 8-5 8 5v5l-8-5-8 5v5l8 5 8-5M17 30v-8"/></svg>
      <span>SQUAD<span class="brand-slash">/</span>CODE<small>DEVELOPMENT NETWORK</small></span>
    </button>
    <nav class="mode-nav" aria-label="Modos do workspace">
      <button class="nav-key" data-action="nav-prev" aria-label="Aba anterior (Q)">Q</button>
      <button data-action="view" data-view="home">PAINEL</button>
      <button data-action="view" data-view="projects">PROJETOS</button>
      <button data-action="view" data-view="network">SQUAD</button>
      <button data-action="view" data-view="handoffs">HANDOFFS</button>
      <button class="nav-key" data-action="nav-next" aria-label="Proxima aba (E)">E</button>
    </nav>
    <div class="system-meta">
      <button class="mode-indicator" id="modeIndicator" data-action="settings-claude" aria-label="Status do Claude Code"><i></i>CLAUDE CODE / VERIFICANDO</button>
      <button class="icon-button" data-action="settings" aria-label="Configuracoes" title="Configura&ccedil;&otilde;es"><span data-icon="settings"></span></button>
    </div>
  </header>

  <aside class="left-hud hud" id="leftHud" aria-label="Projeto e squad"></aside>
  <aside class="ops-chat hud" id="opsChat" aria-label="Chat da operação" hidden></aside>
  <aside class="right-hud hud" id="rightHud" aria-label="Agente selecionado"></aside>

  <div class="map-side-controls hud" aria-label="Controles do mapa">
    <button class="view-toggle" data-action="squad-view" aria-label="Alternar vista do mapa"><span class="vt-cube" aria-hidden="true"><span class="vt-face vt-city" data-icon="map-city"></span><span class="vt-face vt-office" data-icon="map-office"></span></span><span class="msc-tip" aria-hidden="true"><b>Alternar vista</b><kbd>V</kbd></span></button>
    <button class="shape-toggle" data-action="city-shape" aria-pressed="false" aria-label="Cidade plana. Dobrar em planeta"><span data-icon="map-planet"></span><span class="msc-tip" aria-hidden="true"><b>Dobrar em planeta</b><kbd>P</kbd></span></button>
    <span class="map-control-line"></span>
    <div class="msc-zoom" role="group" aria-label="Zoom do mapa">
      <button class="msc-in" data-action="zoom-in" aria-label="Ampliar mapa"><span data-icon="map-zoom-in"></span><span class="msc-tip" aria-hidden="true"><b>Ampliar</b><kbd>+</kbd></span></button>
      <span id="zoomValue">100%</span>
      <button class="msc-out" data-action="zoom-out" aria-label="Reduzir mapa"><span data-icon="map-zoom-out"></span><span class="msc-tip" aria-hidden="true"><b>Reduzir</b><kbd>&minus;</kbd></span></button>
    </div>
    <button class="msc-center" data-action="map-reset" aria-label="Centralizar mapa"><span data-icon="map-center"></span><span class="msc-tip" aria-hidden="true"><b>Centralizar</b><kbd>0</kbd></span></button>
    <button class="msc-rot-l" data-action="map-rotate" data-dir="-1" aria-label="Girar mapa para a esquerda"><span data-icon="map-rot-left"></span><span class="msc-tip" aria-hidden="true"><b>Girar &agrave; esquerda</b><kbd>[</kbd></span></button>
    <button class="msc-rot-r" data-action="map-rotate" data-dir="1" aria-label="Girar mapa para a direita"><span data-icon="map-rot-right"></span><span class="msc-tip" aria-hidden="true"><b>Girar &agrave; direita</b><kbd>]</kbd></span></button>
    <span class="map-control-line"></span>
    <button class="msc-panels" data-action="focus" aria-label="Ocultar paineis"><span data-icon="map-panels"></span><span class="msc-tip" aria-hidden="true"><b>Ocultar pain&eacute;is</b><kbd>H</kbd></span></button>
  </div>

  <footer class="bottom-hud hud">
    <div class="control-legend">
      <div class="legend-strip"><button data-action="help"><kbd class="mouse-key">M</kbd> ARRASTAR MAPA</button><button data-action="zoom-in"><kbd>+</kbd><kbd>&minus;</kbd> ZOOM</button><button data-action="map-reset"><kbd>0</kbd> CENTRALIZAR</button><i class="legend-sep" aria-hidden="true"></i><button data-action="agent-new"><kbd>A</kbd> NOVO AGENTE</button><button data-action="briefing"><kbd>B</kbd> BRIEFING</button><button data-action="features"><kbd>F</kbd> FEATURES</button><button data-action="help"><kbd>?</kbd></button></div>
      <div class="workspace-note" id="storageState"></div>
    </div>
    <button class="transmission-strip" id="transmissionStrip" data-action="logs" aria-label="Abrir transmissoes" tabindex="-1"></button>
    <div class="operation-progress" id="operationProgress"></div>
  </footer>
  <button class="restore-hud" id="restoreHud" data-action="focus"><span data-icon="eye"></span> MOSTRAR PAIN&Eacute;IS</button>
</main>
<div id="sqPopRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite" aria-atomic="false"></div>
<input id="importInput" type="file" accept="application/json,.json" hidden>
<!--SCRIPTS-->
</body>
</html>
